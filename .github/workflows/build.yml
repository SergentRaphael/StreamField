# Construit StreamField pour toutes les plateformes à chaque envoi sur « main »,
# puis publie les fichiers dans l'onglet « Releases » du dépôt.
# Liens fixes vers la dernière version :
#   https://github.com/SergentRaphael/StreamField/releases/latest/download/StreamField-Android.apk
name: Build StreamField

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_NAME: 1.0.${{ github.run_number }}
  BUILD_NUMBER: ${{ github.run_number }}

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: bash .github/run.sh flutter pub get
      - run: bash .github/run.sh flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: bash .github/run.sh flutter test

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Clé de signature fixe (mises à jour sans désinstaller)
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
            echo "Clé fixe installée."
          else
            echo "Pas de clé fixe : signature temporaire."
          fi
      - run: bash .github/run.sh flutter pub get
      - run: bash .github/run.sh dart run tool/setup.dart
      - run: bash .github/run.sh flutter build apk --release --build-name=${{ env.BUILD_NAME }} --build-number=${{ env.BUILD_NUMBER }}
      - run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/StreamField-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash .github/run.sh flutter pub get
      - run: bash .github/run.sh dart run tool/setup.dart
      - run: bash .github/run.sh flutter build windows --release --build-name=${{ env.BUILD_NAME }} --build-number=${{ env.BUILD_NUMBER }}
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/StreamField-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/

  macos:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash .github/run.sh flutter pub get
      - run: bash .github/run.sh dart run tool/setup.dart
      - run: bash .github/run.sh flutter build macos --release --build-name=${{ env.BUILD_NAME }} --build-number=${{ env.BUILD_NUMBER }}
      - run: |
          mkdir -p dist
          ditto -c -k --keepParent build/macos/Build/Products/Release/StreamField.app dist/StreamField-Mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/

  ios:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash .github/run.sh flutter pub get
      - run: bash .github/run.sh dart run tool/setup.dart
      - run: bash .github/run.sh flutter build ios --release --no-codesign --build-name=${{ env.BUILD_NAME }} --build-number=${{ env.BUILD_NUMBER }}
      # .ipa non signé : Sideloadly le signe avec ton identifiant Apple au moment de l'installation.
      - run: |
          mkdir -p Payload dist
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry dist/StreamField-iOS.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/

  release:
    needs: [android, windows, macos, ios]
    if: ${{ !cancelled() && needs.android.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.BUILD_NAME }}
          name: StreamField ${{ env.BUILD_NAME }}
          make_latest: "true"
          files: dist/*
          body: |
            **Quel fichier prendre ?**
            - 📺📱 Android, Android TV, Google TV, Fire TV : `StreamField-Android.apk`
            - 💻 PC Windows : `StreamField-Windows.zip` (dézipper, puis lancer `streamfield.exe`)
            - 🍎 Mac : `StreamField-Mac.zip` (premier lancement : clic droit → Ouvrir)
            - 📱 iPhone / iPad : `StreamField-iOS.ipa` (à installer avec Sideloadly)
