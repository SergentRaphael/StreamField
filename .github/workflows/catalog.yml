# Régénère chaque jour le catalogue « TV du monde » (iptv-org + Free-TV),
# classé par pays et par notoriété, sur la branche « catalog ».
# L'app le télécharge depuis :
#   https://raw.githubusercontent.com/SergentRaphael/StreamField/catalog/catalog.m3u
name: Catalogue TV du monde

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tool/catalog/**"
      - ".github/workflows/catalog.yml"

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install babel
      - run: python3 tool/catalog/build_catalog.py out
      - name: Publier sur la branche « catalog »
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b catalog
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Catalogue du $(date -u +%F)"
          git push -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" catalog
