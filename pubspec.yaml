name: streamfield
description: StreamField — lecteur IPTV léger pour Windows, macOS, Android et Android TV.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  media_kit: ">=1.1.11 <2.0.0"
  media_kit_video: ">=1.2.5 <3.0.0"
  media_kit_libs_video: ">=1.0.5 <2.0.0"
  http: ">=1.2.2 <2.0.0"
  shared_preferences: ">=2.3.3 <3.0.0"
  path_provider: ">=2.1.4 <3.0.0"
  file_picker: ">=8.1.4 <11.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/playlists/
